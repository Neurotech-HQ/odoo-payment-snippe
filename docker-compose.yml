# Local Odoo 18 with this module mounted, for development and testing.
# Start: docker compose up -d, then open http://localhost:8069
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    depends_on: [db]
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./payment_snippe:/mnt/extra-addons/payment_snippe
      - ./odoo.conf:/etc/odoo/odoo.conf:ro

volumes:
  db-data:
  odoo-data:
